<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>kit view</title>
<style>
  html,body{margin:0;height:100%;background:#12161c;overflow:hidden}
  canvas{display:block}
  #hud{position:fixed;left:12px;top:10px;color:#9ff2e6;font:12px/1.5 ui-monospace,monospace;white-space:pre}
</style>
</head>
<body>
<div id="hud">загрузка…</div>
<script type="importmap">
{ "imports": { "three": "../vendor/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from '../vendor/loaders/GLTFLoader.js';

const q = new URLSearchParams(location.search);
const id = q.get('m') || 'temple-gateway';
const yaw = Number(q.get('yaw') || 35) * Math.PI / 180;
const elevation = Number(q.get('el') || 18) * Math.PI / 180;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x12161c);
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 4000);

scene.add(new THREE.HemisphereLight(0xbcd4e6, 0x2a2620, 1.1));
const sun = new THREE.DirectionalLight(0xfff2dd, 2.0);
sun.position.set(60, 90, 40);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x88aacc, 0.6);
fill.position.set(-70, 30, -50);
scene.add(fill);

const grid = new THREE.GridHelper(80, 40, 0x2a3a46, 0x1c2731);
scene.add(grid);
const axes = new THREE.AxesHelper(6);
scene.add(axes);

const gltf = await new GLTFLoader().loadAsync(`../assets/world-kit/${id}.glb`);
const root = gltf.scene;
root.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(root);
const size = box.getSize(new THREE.Vector3());
const center = box.getCenter(new THREE.Vector3());
root.position.sub(center);          // ставим в центр сцены
root.position.y += size.y / 2;      // низ — на землю
scene.add(root);

const radius = size.length() / 2;
const dist = radius / Math.sin((camera.fov * Math.PI / 360)) * 1.05;
camera.position.set(
  Math.sin(yaw) * Math.cos(elevation) * dist,
  size.y * 0.55 + Math.sin(elevation) * dist,
  Math.cos(yaw) * Math.cos(elevation) * dist,
);
camera.lookAt(0, size.y * 0.45, 0);

document.getElementById('hud').textContent =
  `${id}\nразмер: ${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} м`;

let t = 0;
function frame() {
  requestAnimationFrame(frame);
  t += 0.016;
  renderer.render(scene, camera);
}
frame();
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
window.__kit = { scene, camera, root, size, THREE };
</script>
</body>
</html>
